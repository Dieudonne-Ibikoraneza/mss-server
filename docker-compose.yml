name: magnificat-smart-space

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: magnificat
      POSTGRES_PASSWORD: magnificat
      POSTGRES_DB: magnificat_smart_space
    ports:
      - "5432:5432"
    volumes:
      - magnificat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magnificat -d magnificat_smart_space"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - magnificat_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  magnificat_postgres_data:
  magnificat_redis_data:
